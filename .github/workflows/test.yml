name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev libsqlite3-dev libgl1-mesa-dev ffmpeg python3
      - name: Build (warnings are errors)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMTV_WERROR=ON && cmake --build build
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen ./build/mtv_tests
      - name: Shell syntax and EDID files
        run: |
          bash -n install.sh packaging/make-test-clip.sh
          sh -n packaging/mechanical-tv-hw-setup
          python3 packaging/make-edid.py --check
  debian-trixie:
    # The Raspberry Pi OS toolchain (Debian 13: GCC 14, Qt 6.8)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies and FFmpeg
        run: apt-get update && apt-get install -y build-essential cmake ninja-build qt6-base-dev libsqlite3-dev ffmpeg
      - name: Build (warnings are errors)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMTV_WERROR=ON && cmake --build build
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen ./build/mtv_tests
